# Blueprint Render pour le moteur scientifique Python (dossier python-engine/).
# Aucun secret ici : les valeurs sync:false sont saisies dans le tableau de bord Render.
services:
  - type: web
    name: energie-renouvelable-engine
    runtime: python
    rootDir: python-engine
    plan: starter # le plan free s'endort après inactivité (démarrage ~1 min) : prototype uniquement
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --timeout-keep-alive 30
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENGINE_ENV
        value: production
      - key: ENGINE_SHARED_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://energie-renouvelable.lovable.app
      - key: MAX_BODY_BYTES
        value: "3000000"
